version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: restaurant-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-restaurant_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    image: mysql:8.0
    container_name: restaurant-db-backup
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-restaurant_db}
    volumes:
      - db_backups:/backups
    entrypoint: >
      sh -c 'while true; do
        STAMP=$$(date +%Y%m%d_%H%M%S);
        mysqldump -h mysql-db -u root --single-transaction --routines --triggers "$$MYSQL_DATABASE" | gzip > "/backups/$${MYSQL_DATABASE}_$${STAMP}.sql.gz";
        find /backups -name "*.sql.gz" -mtime +14 -delete;
        sleep 86400;
      done'

  backend:
    build: .
    container_name: restaurant-backend
    ports:
      - "8080:8080"
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE:-restaurant_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      APP_SUPERADMIN_EMAIL: ${APP_SUPERADMIN_EMAIL:?APP_SUPERADMIN_EMAIL is required}
      APP_SUPERADMIN_PASSWORD: ${APP_SUPERADMIN_PASSWORD:?APP_SUPERADMIN_PASSWORD is required}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: restaurant-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  db_backups: